name: Deploy to FTP Server

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: 🚀 Deploy website every commit
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        run:   npm run build
        uses: ./
        with:
          server: ${{ git_ftp_server }}
          username: ${{ git_ftp_username }}
          password: ${{ git_ftp_password }}
          protocol: 'ftps'
          local-dir: './build'
          remote-dir: '/'
          sync-options: '--delete --verbose'
